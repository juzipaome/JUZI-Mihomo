name: Validate Mihomo config

on:
  push:
    paths:
      - "config/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "config/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate YAML and public-safe provider URL
        run: |
          python - <<'PY'
          import pathlib, yaml
          p = pathlib.Path("config/JUZI-PC.yaml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))
          actual = data["proxy-providers"]["iKuuu_V2"].get("url")
          expected = "__IKUUU_SUBSCRIPTION_URL__"
          if actual != expected:
              raise SystemExit("Refusing public config: iKuuu URL must remain the placeholder.")
          if data.get("mode") != "rule":
              raise SystemExit("Expected mode: rule")
          if data.get("rules", [])[-1] != "MATCH,节点选择":
              raise SystemExit("Expected final rule: MATCH,节点选择")
          print("OK: YAML valid and subscription URL is not committed.")
          PY
