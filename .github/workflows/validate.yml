name: Validate Mihomo config

on:
  push:
    paths:
      - "config/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "config/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate YAML and public-safe provider URL
        run: |
          python - <<'PY'
          import pathlib, yaml

          expected = "__IKUUU_SUBSCRIPTION_URL__"
          files = [
              pathlib.Path("config/JUZI-PC.yaml"),
              pathlib.Path("config/JUZI-Mobile.yaml"),
          ]

          for p in files:
              data = yaml.safe_load(p.read_text(encoding="utf-8"))
              actual = data["proxy-providers"]["iKuuu_V2"].get("url")
              if actual != expected:
                  raise SystemExit(f"{p}: iKuuu URL must remain the public placeholder")
              if data.get("mode") != "rule":
                  raise SystemExit(f"{p}: expected mode: rule")
              if data.get("rules", [])[-1] != "MATCH,节点选择":
                  raise SystemExit(f"{p}: expected final rule MATCH,节点选择")
              if "github" not in data.get("rule-providers", {}):
                  raise SystemExit(f"{p}: github rule-provider missing")

          mobile = yaml.safe_load(pathlib.Path("config/JUZI-Mobile.yaml").read_text(encoding="utf-8"))
          if mobile.get("tun", {}).get("enable") is not False:
              raise SystemExit("Mobile config must keep Mihomo TUN disabled for Mishka ROOT TPROXY")

          print("OK: PC and Mobile YAML are valid and public-safe.")
          PY
